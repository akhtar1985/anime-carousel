name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are pointless — cancel them.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: import audit + legacy API lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # scripts/check.js only uses node: built-ins, so no install step is needed.
      # Adding dependencies later? Add a lockfile and an `npm ci` step above.
      - name: Run checks
        run: npm run check

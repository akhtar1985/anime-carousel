name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are pointless — cancel them.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: import audit + legacy API lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # check.js only needs node: built-ins, but the state/effect tests import
      # the engine, which imports animejs — so the dev dependency is required.
      - name: Install dev dependency
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: npm run check

      # Guard the guard: every check is re-run against a deliberately broken
      # copy of the tree.
      - name: Test the checks
        run: npm test
